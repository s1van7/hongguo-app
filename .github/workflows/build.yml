name: 构建影屿

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  PYTHONUTF8: '1'
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  # 红果源自动更新地址：优先 raw（更新最及时），失败再回退 jsDelivr
  ONLY_SOURCE_UPDATE_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main/modules_src/yingyu,https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/modules_src/yingyu

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      name: ${{ steps.read.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=${version//+/-}" >> "$GITHUB_OUTPUT"
          echo "版本：$version"

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 安装 Android SDK 与 NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "找不到 sdkmanager，ANDROID_HOME=$ANDROID_HOME" >&2
            ls "$ANDROID_HOME" >&2
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: 配置签名
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/release.jks
            {
              echo 'storeFile=release.jks'
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "使用仓库 Secrets 中的签名证书。"
          else
            printf 'storeFile=yingyu.jks\nstorePassword=hongguo2026\nkeyAlias=hongguo\nkeyPassword=hongguo2026\n' > android/key.properties
            echo "未配置 Secrets，使用仓库内自带的签名证书。"
          fi

      - name: 编译 Go 核心（内置站源）
        run: python3 scripts/build_native.py --platform android --abi arm64-v8a --abi armeabi-v7a --abi x86_64 --bundle modules_src/yingyu

      - run: flutter pub get --enforce-lockfile

      - name: 构建 arm64-v8a
        run: flutter build apk --release --no-pub --split-per-abi --target-platform android-arm64

      - name: 构建 armeabi-v7a
        run: flutter build apk --release --no-pub --split-per-abi --target-platform android-arm

      - name: 构建 x86_64
        run: flutter build apk --release --no-pub --split-per-abi --target-platform android-x64

      - name: 收集产物
        run: |
          set -euo pipefail
          mkdir -p dist/android
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$apk" | sed 's/^app-//; s/-release\.apk$//')
            cp "$apk" "dist/android/yingyu-${{ needs.version.outputs.name }}-${abi}.apk"
          done
          ls -lh dist/android

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 30

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 安装 MinGW-w64 与 Inno Setup
        shell: pwsh
        run: |
          choco install mingw innosetup --no-progress -y
          $exe = Get-ChildItem -Path 'C:\ProgramData\mingw64', 'C:\ProgramData\chocolatey\lib\mingw' `
                   -Recurse -Include 'x86_64-w64-mingw32-gcc.exe', 'gcc.exe' -ErrorAction SilentlyContinue |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { $exe = (Get-Command x86_64-w64-mingw32-gcc -ErrorAction SilentlyContinue).Source }
          if (-not $exe) { throw 'MinGW-w64 安装失败，找不到 gcc' }
          Split-Path $exe | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $exe --version | Select-Object -First 1

      - name: 编译并打包 Windows 版
        run: python scripts/build_windows.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          NAME: ${{ needs.version.outputs.name }}
        run: |
          set -euo pipefail
          tag="v${NAME}"
          ls -lh release
          cat > notes.md <<EOF
          影屿 ${VERSION}

          Android：
          - *-arm64-v8a.apk：大多数手机
          - *-armeabi-v7a.apk：较老的 32 位手机
          - *-x86_64.apk：模拟器

          Windows：
          - *-windows-x64-setup.exe：安装包，默认装到当前用户，无需管理员权限
          - *-windows-x64.zip：便携版，解压后运行 yingyu.exe，数据保存在程序旁的 userdata 目录

          站源会在启动时自动检查更新（从本仓库 modules_src/yingyu 拉取），也可以在 设置 › 关于 手动检查。
          EOF
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --title "影屿 ${VERSION}" --notes-file notes.md
          fi
