name = "yingyu-sync"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 部署前先建库：npx wrangler d1 create yingyu
# 把返回的 database_id 填到下面。
[[d1_databases]]
binding = "DB"
database_name = "yingyu"
database_id = "9f77e58c-d222-4327-be7c-d353940705be"

# 密码校验用的 pepper 走 secret，不要写进这个文件：
#   npx wrangler secret put PEPPER
# 改了 pepper 等于所有账号都要重新注册。
